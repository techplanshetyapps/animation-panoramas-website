name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:latest
        ports:
          - 9000:9000
          - 8123:8123
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Run tests against ClickHouse
        run: |
          echo "ClickHouse service container is running for CI tests."
