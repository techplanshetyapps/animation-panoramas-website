name: ecosystem_viewer
description: Flutter application replicating the React ecosystem 3D/2D viewer.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.4.0
  model_viewer_plus: ^1.7.0 # Excellent package for loading .glb models easily via web view/platform view
  font_awesome_flutter: ^11.0.0
  intl: ^0.19.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/models/
    - assets/sprites/